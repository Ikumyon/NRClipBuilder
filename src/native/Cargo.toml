[package]
name = "nrclip-native"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
geo = "0.33.1"
mvt = "0.15"
pmtiles = { version = "0.25", default-features = false, features = ["write"] }
open = "5.4.5"
pyo3 = { version = "0.30.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tempfile = "3.27.0"
zstd = "0.14.3"

[features]
extension-module = ["pyo3/extension-module"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem"] }

