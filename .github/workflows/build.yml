name: Test and package
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            archive: NRClipBuilder-windows-x64.zip
            executable: dist/NRClipBuilder/NRClipBuilder.exe
          - os: ubuntu-24.04
            archive: NRClipBuilder-linux-x64.tar.gz
            executable: dist/NRClipBuilder/NRClipBuilder
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Prepare application version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          args = [sys.executable, "packaging/versioning.py"]
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              args += ["--tag", os.environ["RELEASE_TAG"]]
          subprocess.run(args, check=True)
      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build React map
        working-directory: src/web
        run: |
          npm ci
          npm test
          npm run format:check
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb weston libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libasound2t64 libnss3 libgbm1
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build and install native wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([sys.executable, "-m", "maturin", "build", "--release", "--locked", "--out", "build/wheels"], check=True)
          wheels = list(Path("build/wheels").glob("*.whl"))
          if len(wheels) != 1:
              raise RuntimeError(f"Expected exactly one built wheel, found {wheels}")
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", "--force-reinstall", str(wheels[0])], check=True)
      - name: Verify installed application version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          expected = os.environ["EXPECTED_VERSION"]
          subprocess.run([sys.executable, "packaging/verify_version.py", expected], check=True)
          result = subprocess.run([sys.executable, "-m", "nrclip_builder", "--version"], check=True, capture_output=True, text=True)
          if result.stdout.strip() != f"NRClipBuilder {expected}":
              raise RuntimeError(f"Unexpected --version output: {result.stdout!r}")
      - name: Package
        run: python -m PyInstaller --noconfirm --clean packaging/nrclip_builder.spec
      - name: Verify executable version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, "packaging/verify_version.py", os.environ["EXPECTED_VERSION"],
                          "--executable", os.environ["EXECUTABLE"]], check=True)
      - name: Windows packaged smoke test
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          NRCLIP_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath $env:EXECUTABLE -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $appProcess.WaitForExit(120000)) {
            $appProcess.Kill()
            throw 'Packaged smoke test timed out'
          }
          if ($appProcess.ExitCode -ne 0) { throw "Packaged smoke test failed: $($appProcess.ExitCode)" }
      - name: Linux X11 packaged smoke test
        if: runner.os == 'Linux'
        env:
          NRCLIP_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
        run: timeout 120s xvfb-run -a "$EXECUTABLE" --smoke-test
      - name: Linux Wayland packaged smoke test
        if: runner.os == 'Linux'
        env:
          NRCLIP_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-nrclip --idle-time=0 &
          compositor=$!
          trap 'kill "$compositor"' EXIT
          for i in $(seq 1 30); do test -S "$XDG_RUNTIME_DIR/wayland-nrclip" && break; sleep 1; done
          WAYLAND_DISPLAY=wayland-nrclip QT_QPA_PLATFORM=wayland timeout 120s "$EXECUTABLE" --smoke-test
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/NRClipBuilder -DestinationPath '${{ matrix.archive }}'
      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -czf '${{ matrix.archive }}' -C dist NRClipBuilder
      - name: Transfer release archive
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ github.event.release.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v7
        with:
          pattern: NRClipBuilder-*
          path: artifacts
          merge-multiple: true
      - name: Attach both distribution archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          test -s artifacts/NRClipBuilder-windows-x64.zip
          test -s artifacts/NRClipBuilder-linux-x64.tar.gz
          gh release upload "$RELEASE_TAG" artifacts/NRClipBuilder-windows-x64.zip artifacts/NRClipBuilder-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          python packaging/verify_assets.py
